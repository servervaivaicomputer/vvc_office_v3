<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#08080c;--surface:#101018;--card:#15151f;--card2:#1a1a26;--accent:#00ff88;--accent2:#00cc6a;--text:#e4e4e8;--muted:#5a5a6e;--danger:#ff4757;--warning:#ffa502;--border:#1e1e2e;--font-h:'Syne',sans-serif;--font-b:'DM Mono',monospace;--sidebar:220px}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:13px;min-height:100vh;display:flex}
a{color:var(--accent);text-decoration:none}
.sidebar{width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);height:100vh;position:fixed;top:0;left:0;display:flex;flex-direction:column;z-index:100}
.sidebar .logo{padding:16px;font-family:var(--font-h);font-weight:700;font-size:14px;color:var(--accent);border-bottom:1px solid var(--border)}
.sidebar nav{flex:1;padding:8px;overflow-y:auto}
.sidebar nav a{display:block;padding:8px 12px;border-radius:6px;color:var(--muted);font-size:12px;transition:.2s;margin-bottom:2px}
.sidebar nav a:hover,.sidebar nav a.active{color:var(--accent);background:var(--card)}
.sidebar .foot{padding:12px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
.main{margin-left:var(--sidebar);flex:1;min-height:100vh}
.topbar{height:48px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:50}
.topbar h2{font-family:var(--font-h);font-size:14px}
.topbar .info{display:flex;align-items:center;gap:8px;font-size:11px}
.topbar .badge{background:var(--accent);color:#000;padding:2px 6px;border-radius:8px;font-size:10px}
.btn-sm{background:transparent;border:1px solid var(--muted);color:var(--muted);padding:4px 10px;border-radius:4px;font-family:var(--font-b);font-size:11px;cursor:pointer;transition:.2s}
.btn-sm:hover{border-color:var(--danger);color:var(--danger)}
.content{padding:20px;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.panel{display:none}.panel.active{display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px}
.stat .label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.stat .value{font-family:var(--font-h);font-size:24px;font-weight:700}
.tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid var(--border);font-size:11px}
tr:hover td{background:var(--card2)}
.badge-status{display:inline-block;padding:2px 6px;border-radius:8px;font-size:10px}
.badge-active{background:#00ff8822;color:var(--accent)}
.badge-blocked{background:#ff475722;color:var(--danger)}
.badge-inactive{background:#ffa50222;color:var(--warning)}
.badge-admin{background:#6366f122;color:#a78bfa}
.btn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:4px;font-family:var(--font-b);font-size:11px;cursor:pointer;border:1px solid transparent;transition:.2s}
.btn-primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:500}
.btn-primary:hover{background:var(--accent2)}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-outline:hover{border-color:var(--text);color:var(--text)}
.btn-group{display:flex;gap:3px;flex-wrap:wrap}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:10px;width:440px;max-width:95vw;max-height:85vh;overflow-y:auto;padding:20px}
.modal h3{font-family:var(--font-h);font-size:16px;margin-bottom:12px}
.modal label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;margin-top:10px}
.modal input,.modal select{width:100%;padding:7px 10px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font-b);font-size:12px;outline:none}
.modal input:focus,.modal select:focus{border-color:var(--accent)}
.modal .actions{display:flex;gap:6px;justify-content:flex-end;margin-top:16px}
.check-group{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.check-group label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text);text-transform:none;letter-spacing:0}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
.chart-box h3{font-family:var(--font-h);font-size:14px;margin-bottom:10px}
canvas{max-height:250px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters input,.filters select{padding:5px 8px;background:var(--card);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:var(--font-b);font-size:11px;outline:none}
.filters input:focus,.filters select:focus{border-color:var(--accent)}
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">◆ ADMIN</div>
  <nav>
    <a href="#" data-tab="dashboard" class="active">◈ Dashboard</a>
    <a href="#" data-tab="users">☰ Users</a>
    <a href="#" data-tab="stats">▤ Page Stats</a>
    <a href="#" data-tab="logs">▤ Logs</a>
    <a href="#" data-tab="devices">⊞ Devices</a>
  </nav>
  <div class="foot">{{USERNAME}}</div>
</div>

<div class="main">
  <div class="topbar">
    <h2 id="pageTitle">Dashboard</h2>
    <div class="info">
      <span class="badge">ADMIN</span>
      <button class="btn-sm" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <div class="content">

    <div class="panel active" id="panel-dashboard">
      <div class="stats" id="dashStats"></div>
      <div class="tbl-wrap"><table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Page</th><th>IP</th><th>Status</th></tr></thead><tbody id="recentBody"></tbody></table></div>
    </div>

    <div class="panel" id="panel-users">
      <div class="filters">
        <button class="btn btn-primary" onclick="openCreateUser()">+ New User</button>
        <input type="text" id="userSearch" placeholder="Search..." oninput="filterUsers()">
      </div>
      <div class="tbl-wrap"><table><thead><tr><th>Username</th><th>Role</th><th>Status</th><th>Access</th><th>Fails</th><th>Last Login</th><th>IP</th><th>Actions</th></tr></thead><tbody id="usersBody"></tbody></table></div>
    </div>

    <div class="panel" id="panel-stats">
      <div class="stats" id="pageStats"></div>
    </div>

    <div class="panel" id="panel-logs">
      <div class="filters">
        <select id="logAction" onchange="loadLogs()"><option value="">All</option><option>login</option><option>logout</option><option>page_view</option><option>login_failed</option><option>blocked</option><option>unblocked</option><option>user_created</option><option>user_deleted</option></select>
        <select id="logStatus" onchange="loadLogs()"><option value="">All</option><option>success</option><option>failure</option><option>blocked</option></select>
        <input type="text" id="logUser" placeholder="Username..." oninput="debounceLogs()">
      </div>
      <div class="tbl-wrap"><table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Page</th><th>Device</th><th>IP</th><th>Status</th><th>Details</th></tr></thead><tbody id="logsBody"></tbody></table></div>
      <div style="display:flex;gap:6px;margin-top:6px">
        <button class="btn btn-outline" onclick="logsPage(-1)">← Prev</button>
        <span id="logPageInfo" style="line-height:28px;font-size:11px;color:var(--muted)"></span>
        <button class="btn btn-outline" onclick="logsPage(1)">Next →</button>
      </div>
    </div>

    <div class="panel" id="panel-devices">
      <div class="tbl-wrap"><table><thead><tr><th>User</th><th>Device</th><th>IP</th><th>First Seen</th><th>Last Seen</th><th>Status</th><th>Actions</th></tr></thead><tbody id="devicesBody"></tbody></table></div>
    </div>

  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
/* ★ Backend URL + Token — backend inject করে দেয় */
const BACKEND = '{{BACKEND_URL}}';
const TOKEN   = '{{AUTH_TOKEN}}';
const PAGE_SIZE = 50;
let allUsers = [], logOffset = 0, logTotal = 0;

/* ★ API helper — সব request এ Bearer token পাঠায় */
const api = async (path, opts = {}) => {
  try {
    const r = await fetch(BACKEND + path, {
      credentials: 'include',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
      ...opts
    });
    const contentType = r.headers.get('content-type') || '';
    const data = contentType.includes('application/json')
      ? await r.json()
      : { error: 'Backend returned an unexpected response (' + r.status + '). Please sign in again.' };
    if (r.status === 401) {
      sessionStorage.removeItem('sw_auth_token');
      location.href = '/login/';
      return null;
    }
    if (!r.ok && !data.error) data.error = 'Request failed (' + r.status + ').';
    return data;
  } catch (error) {
    return { error: 'Could not reach the backend. Please try again.' };
  }
};

/* Navigation */
document.querySelectorAll('[data-tab]').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    document.querySelectorAll('[data-tab]').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + a.dataset.tab).classList.add('active');
    document.getElementById('pageTitle').textContent = a.textContent.trim();
    if (a.dataset.tab === 'dashboard') loadDashboard();
    if (a.dataset.tab === 'users') loadUsers();
    if (a.dataset.tab === 'stats') loadPageStats();
    if (a.dataset.tab === 'logs') loadLogs();
    if (a.dataset.tab === 'devices') loadDevices();
  });
});

/* Dashboard */
async function loadDashboard() {
  const d = await api('/api/admin/dashboard');
  if (!d) return;
  const s = d.stats;
  document.getElementById('dashStats').innerHTML =
    '<div class="stat"><div class="label">Users</div><div class="value">'+s.totalUsers+'</div></div>' +
    '<div class="stat"><div class="label">Active Today</div><div class="value">'+s.activeToday+'</div></div>' +
    '<div class="stat"><div class="label">Blocked</div><div class="value">'+s.blockedUsers+'</div></div>' +
    '<div class="stat"><div class="label">Views Today</div><div class="value">'+s.viewsToday+'</div></div>' +
    '<div class="stat"><div class="label">Views 7d</div><div class="value">'+s.views7+'</div></div>' +
    '<div class="stat"><div class="label">Views 30d</div><div class="value">'+s.views30+'</div></div>' +
    '<div class="stat"><div class="label">Logins Today</div><div class="value">'+s.loginsToday+'</div></div>';
  document.getElementById('recentBody').innerHTML =
    d.recent.map(l => '<tr><td>'+fmt(l.timestamp)+'</td><td>'+l.username+'</td><td>'+l.action+'</td><td>'+(l.page||'—')+'</td><td>'+(l.ip||'—')+'</td><td>'+sb(l.status)+'</td></tr>').join('');
}

/* Users */
async function loadUsers() {
  const d = await api('/api/admin/users');
  if (!d) return;
  allUsers = d.users;
  renderUsers(allUsers);
}
function filterUsers() {
  const q = document.getElementById('userSearch').value.toLowerCase();
  renderUsers(allUsers.filter(u => u.username.includes(q)));
}
function renderUsers(users) {
  document.getElementById('usersBody').innerHTML = users.map(u =>
    '<tr><td><strong>'+u.username+'</strong></td>' +
    '<td>'+(u.role==='admin'?'<span class="badge-status badge-admin">admin</span>':'user')+'</td>' +
    '<td>'+sb(u.login_status)+'</td>' +
    '<td>'+((u.page_access||[]).join(', ')||'—')+'</td>' +
    '<td>'+(u.failed_login_attempts||0)+'</td>' +
    '<td>'+fmt(u.last_login)+'</td>' +
    '<td>'+(u.last_login_ip||'—')+'</td>' +
    '<td class="btn-group">' +
    '<button class="btn btn-outline" onclick="editAccess(\''+u.id+'\')">Access</button>' +
    (u.is_blocked
      ? '<button class="btn btn-primary" onclick="unblockUser(\''+u.id+'\')">Unblock</button>'
      : '<button class="btn btn-danger" onclick="blockUser(\''+u.id+'\')">Block</button>') +
    (u.role!=='admin'?'<button class="btn btn-danger" onclick="deleteUser(\''+u.id+'\',\''+u.username+'\')">✕</button>':'') +
    '</td></tr>'
  ).join('');
}

function editAccess(id) {
  const u = allUsers.find(x => x.id === id);
  if (!u) return;
  openModal(
    '<h3>Edit: '+u.username+'</h3>' +
    '<label>Page Access</label>' +
    '<div class="check-group">' +
    ['home','about','workspace','dashboard'].map(p =>
      '<label><input type="checkbox" name="pa" value="'+p+'" '+((u.page_access||[]).includes(p)?'checked':'')+'> '+p+'</label>'
    ).join('') +
    '</div>' +
    '<label>Role</label>' +
    '<select id="mRole"><option value="user" '+(u.role==='user'?'selected':'')+'>user</option><option value="admin" '+(u.role==='admin'?'selected':'')+'>admin</option></select>' +
    '<label>New Password (leave blank)</label>' +
    '<input type="password" id="mPass" placeholder="min 8 chars">' +
    '<div class="actions"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveAccess(\''+id+'\')">Save</button></div>'
  );
}
async function saveAccess(id) {
  const pa = [...document.querySelectorAll('input[name=pa]:checked')].map(c => c.value);
  const body = { role: document.getElementById('mRole').value, pageAccess: pa };
  const pass = document.getElementById('mPass').value;
  if (pass && pass.length >= 8) body.password = pass;
  await api('/api/admin/users/' + id, { method: 'PUT', body: JSON.stringify(body) });
  closeModal();
  loadUsers();
}

async function blockUser(id) {
  const reason = prompt('Block reason:');
  await api('/api/admin/users/' + id + '/block', { method: 'POST', body: JSON.stringify({ reason: reason || '' }) });
  loadUsers();
}
async function unblockUser(id) {
  await api('/api/admin/users/' + id + '/unblock', { method: 'POST' });
  loadUsers();
}
async function deleteUser(id, name) {
  if (!confirm('Delete "' + name + '"?')) return;
  await api('/api/admin/users/' + id, { method: 'DELETE' });
  loadUsers();
}

function openCreateUser() {
  openModal(
    '<h3>New User</h3>' +
    '<label>Username</label><input type="text" id="cUser" placeholder="username">' +
    '<label>Password</label><input type="password" id="cPass" placeholder="min 8 chars">' +
    '<label>Role</label><select id="cRole"><option value="user">user</option><option value="admin">admin</option></select>' +
    '<label>Page Access</label>' +
    '<div class="check-group">' +
    ['home','about','workspace','dashboard'].map(p =>
      '<label><input type="checkbox" name="cpa" value="'+p+'"> '+p+'</label>'
    ).join('') +
    '</div>' +
    '<div class="actions"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="createUser()">Create</button></div>'
  );
}
async function createUser() {
  const username = document.getElementById('cUser').value.trim();
  const password = document.getElementById('cPass').value;
  const role = document.getElementById('cRole').value;
  const pageAccess = [...document.querySelectorAll('input[name=cpa]:checked')].map(c => c.value);
  if (!username || password.length < 8) { alert('Username + password (8+ chars) required'); return; }
  const d = await api('/api/admin/users', { method: 'POST', body: JSON.stringify({ username, password, role, pageAccess }) });
  if (d && d.error) { alert(d.error); return; }
  closeModal();
  loadUsers();
}

/* Page Stats */
async function loadPageStats() {
  const d = await api('/api/admin/stats/pages');
  if (!d) return;
  document.getElementById('pageStats').innerHTML =
    ['home','about','workspace','dashboard'].map(p =>
      '<div class="stat"><div class="label">'+p+'</div><div class="value">'+(d.stats[p]?.today||0)+'</div><div style="color:var(--muted);font-size:10px;margin-top:2px">7d: '+(d.stats[p]?.sevenDay||0)+' · 30d: '+(d.stats[p]?.thirtyDay||0)+'</div></div>'
    ).join('');
}

/* Logs */
let logTimer;
function debounceLogs() { clearTimeout(logTimer); logTimer = setTimeout(loadLogs, 400); }
async function loadLogs() {
  const params = new URLSearchParams();
  const action = document.getElementById('logAction').value;
  const status = document.getElementById('logStatus').value;
  const user   = document.getElementById('logUser').value;
  if (action) params.set('action', action);
  if (status) params.set('status', status);
  if (user)   params.set('username', user);
  params.set('limit', PAGE_SIZE);
  params.set('offset', logOffset);
  const d = await api('/api/admin/logs?' + params);
  if (!d) return;
  logTotal = d.total;
  document.getElementById('logsBody').innerHTML =
    d.logs.map(l =>
      '<tr><td>'+fmt(l.timestamp)+'</td><td>'+(l.username||'—')+'</td><td>'+l.action+'</td><td>'+(l.page||'—')+'</td><td style="max-width:120px;overflow:hidden;text-overflow:ellipsis">'+'</td><td>'+(l.ip||'—')+'</td><td>'+sb(l.status)+'</td><td style="max-width:150px;overflow:hidden;text-overflow:ellipsis">'+(l.details||'—')+'</td></tr>'
    ).join('');
  document.getElementById('logPageInfo').textContent = (logOffset+1)+'-'+Math.min(logOffset+PAGE_SIZE,logTotal)+' of '+logTotal;
}
function logsPage(dir) { logOffset = Math.max(0, logOffset + dir * PAGE_SIZE); loadLogs(); }

/* Devices */
async function loadDevices() {
  const d = await api('/api/admin/devices');
  if (!d) return;
  document.getElementById('devicesBody').innerHTML =
    d.devices.map(dev =>
      '<tr><td>'+dev.username+'</td><td>'+dev.name+'</td><td>'+dev.ip+'</td><td>'+fmt(dev.firstSeen)+'</td><td>'+fmt(dev.lastSeen)+'</td>' +
      '<td>'+(dev.isBlocked?'<span class="badge-status badge-blocked">Blocked</span>':'<span class="badge-status badge-active">Active</span>')+'</td>' +
      '<td class="btn-group">' +
      (dev.isBlocked
        ? '<button class="btn btn-primary" onclick="devAct(\''+dev.userId+'\',\''+dev.deviceId+'\',\'unblock\')">Unblock</button>'
        : '<button class="btn btn-danger" onclick="devAct(\''+dev.userId+'\',\''+dev.deviceId+'\',\'block\')">Block</button>') +
      '</td></tr>'
    ).join('');
}
async function devAct(uid, did, act) {
  await api('/api/admin/devices/'+uid+'/'+did+'/'+act, { method: 'POST' });
  loadDevices();
}

/* Helpers */
function fmt(d) { if (!d) return '—'; const dt = new Date(d); return dt.toLocaleDateString('en',{month:'short',day:'numeric'})+' '+dt.toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'}); }
function sb(s) { const c={active:'badge-active',success:'badge-active',blocked:'badge-blocked',failure:'badge-blocked',inactive:'badge-inactive'}; return '<span class="badge-status '+(c[s]||'badge-inactive')+'">'+(s||'—')+'</span>'; }
function openModal(h) { document.getElementById('modalContent').innerHTML=h; document.getElementById('modalOverlay').classList.add('open'); }
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target===e.currentTarget) closeModal(); });

async function doLogout() {
  await fetch(BACKEND+'/api/auth/logout', { method:'POST', credentials:'include', headers:{'Authorization':'Bearer '+TOKEN} });
  sessionStorage.removeItem('sw_auth_token');
  location.href = '/login/';
}

/* ★ Init */
loadDashboard();
</script>
</body>
</html>
