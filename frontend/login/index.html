<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Secure Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">◆ SECURE WORKSPACE</div>
    <h1>Sign In</h1>
    <p class="auth-sub">Enter your credentials to access protected content.</p>

    <div id="alert" class="alert" style="display:none"></div>

    <form id="loginForm" autocomplete="off">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required minlength="3" maxlength="30" placeholder="username" autofocus>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="1" placeholder="••••••••">

      <button type="submit" class="btn-primary full" id="submitBtn">Authenticate</button>
    </form>

    <div class="auth-footer">
      <a href="/">← Back to home</a>
      <span>·</span>
      <a href="/admin/">Admin Login</a>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
const form   = document.getElementById('loginForm');
const alertEl = document.getElementById('alert');
const btn     = document.getElementById('submitBtn');

/* Redirect URL থেকে error message দেখাও */
const params = new URLSearchParams(window.location.search);
if (params.get('error')) {
  const msgs = {
    invalid_token:  'Your session token was invalid. Please log in again.',
    expired:        'Your session has expired. Please log in again.',
    blocked:        'Your account has been blocked. Contact an administrator.',
    device_blocked: 'This device has been blocked. Contact an administrator.',
    not_admin:      'Admin access required.',
    auth_failed:    'Authentication failed. Please log in again.',
    user_not_found: 'User account not found.'
  };
  showAlert(msgs[params.get('error')] || 'Authentication error.', 'error');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (!username || !password) return showAlert('Both fields required.', 'error');

  btn.disabled    = true;
  btn.textContent = 'Authenticating…';

  /* ★ Auth.login() ব্যবহার করো */
  const result = await Auth.login(username, password);

  if (result.error) {
    showAlert(
      result.error +
      (result.attemptsRemaining !== undefined
        ? ` (${result.attemptsRemaining} attempts remaining)`
        : ''),
      'error'
    );
    btn.disabled    = false;
    btn.textContent = 'Authenticate';
    return;
  }

  /* Login success — token sessionStorage-এ save হয়ে গেছে */
  /* ★ Redirect frontend URL-এই হবে, backend-এ না */
  const redirect = params.get('redirect');

  if (redirect && redirect.startsWith('/')) {
    window.location.href = redirect;           // যেমন /about বা /workspace
  } else {
    window.location.href = '/about/';          // default redirect
  }
});

function showAlert(msg, type) {
  alertEl.textContent = msg;
  alertEl.className   = 'alert ' + type;
  alertEl.style.display = 'block';
}
</script>
</body>
</html>
