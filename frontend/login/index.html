<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Secure Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *,
  *::before,
  *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #f4f1eb;
    --surface: #ffffff;
    --accent: #1a1a1a;
    --accent-soft: #e8e5df;
    --text: #1a1a1a;
    --text-muted: #8a8580;
    --border: #ddd8d0;
    --success: #2d6a4f;
    --error: #c1292e;
    --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
    --shadow-lg: 0 4px 12px rgba(0,0,0,0.06), 0 20px 48px rgba(0,0,0,0.08);
    --radius: 10px;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  body {
    font-family: var(--font-mono);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -40%;
    right: -20%;
    width: 700px;
    height: 700px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200,190,175,0.25) 0%, transparent 70%);
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    bottom: -30%;
    left: -15%;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(180,170,155,0.2) 0%, transparent 70%);
    pointer-events: none;
  }

  .auth-page {
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 1;
    animation: fadeUp 0.5s ease forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    padding: 40px 36px 32px;
  }

  .auth-brand {
    font-family: var(--font-display);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .auth-brand::before {
    content: '';
    width: 8px;
    height: 8px;
    background: var(--accent);
    display: inline-block;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
    letter-spacing: -0.02em;
  }

  .auth-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 28px;
    line-height: 1.5;
  }

  .alert {
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 18px;
    line-height: 1.45;
    border: 1px solid;
  }

  .alert.error {
    background: #fdf2f2;
    color: var(--error);
    border-color: #f5c6c6;
  }

  .alert.success {
    background: #f0f9f4;
    color: var(--success);
    border-color: #b7e4c7;
  }

  label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 11px 14px;
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    margin-bottom: 18px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    outline: none;
  }

  input[type="text"]:focus,
  input[type="password"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(26,26,26,0.06);
  }

  input::placeholder {
    color: #b5b0a8;
  }

  .btn-primary {
    width: 100%;
    padding: 12px 20px;
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    margin-top: 4px;
  }

  .btn-primary:hover {
    background: #333;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }

  .btn-primary:active {
    transform: scale(0.985);
  }

  .btn-primary:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    transform: none;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 24px 0 20px;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .auth-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }

  .auth-footer a {
    font-size: 12px;
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.2s ease;
    letter-spacing: 0.01em;
  }

  .auth-footer a:hover {
    color: var(--text);
  }

  .admin-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    text-decoration: none;
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 5px;
    transition: all 0.2s ease;
  }

  .admin-link:hover {
    color: var(--text);
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .admin-link svg {
    width: 13px;
    height: 13px;
  }

  .version {
    text-align: center;
    margin-top: 20px;
    font-size: 11px;
    color: #c5c0b8;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">Secure Workspace</div>
    <h1>Sign In</h1>
    <p class="auth-sub">Enter your credentials to access your workspace.</p>

    <div id="alert" class="alert" style="display:none"></div>

    <form id="loginForm" autocomplete="off">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required minlength="3" maxlength="30" placeholder="your username" autofocus>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="1" placeholder="your password">

      <button type="submit" class="btn-primary" id="submitBtn">Authenticate</button>
    </form>

    <div class="auth-footer">
      <a href="/">← Back to home</a>
      <a href="/admin" class="admin-link">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Admin
      </a>
    </div>
  </div>
  <div class="version">v1.0 — Secure Workspace</div>
</div>

<script src="/js/app.js"></script>
<script>
var form   = document.getElementById('loginForm');
var alertEl = document.getElementById('alert');
var btn     = document.getElementById('submitBtn');

var params = new URLSearchParams(window.location.search);
if (params.get('error')) {
  var msgs = {
    invalid_token:  'Your session token was invalid. Please log in again.',
    expired:        'Your session has expired. Please log in again.',
    blocked:        'Your account has been blocked. Contact an administrator.',
    device_blocked: 'This device has been blocked. Contact an administrator.',
    not_admin:      'Admin access required.',
    auth_failed:    'Authentication failed. Please log in again.',
    user_not_found: 'User account not found.'
  };
  showAlert(msgs[params.get('error')] || 'Authentication error.', 'error');
}

form.addEventListener('submit', async function(e) {
  e.preventDefault();
  var username = document.getElementById('username').value.trim();
  var password = document.getElementById('password').value;

  if (!username || !password) return showAlert('Both fields required.', 'error');

  btn.disabled    = true;
  btn.textContent = 'Authenticating...';

  var result = await Auth.login(username, password);

  if (result.error) {
    var msg = result.error;
    if (result.attemptsRemaining !== undefined) {
      msg = msg + ' (' + result.attemptsRemaining + ' attempts remaining)';
    }
    showAlert(msg, 'error');
    btn.disabled    = false;
    btn.textContent = 'Authenticate';
    return;
  }

  var redirect = params.get('redirect');

  if (redirect && redirect.startsWith('/')) {
    window.location.href = redirect;
  } else if (result.user && result.user.role === 'admin') {
    window.location.href = '/admin';
  } else {
    window.location.href = '/about/';
  }
});

function showAlert(msg, type) {
  alertEl.textContent    = msg;
  alertEl.className      = 'alert ' + type;
  alertEl.style.display  = 'block';
}
</script>
</body>
</html>
