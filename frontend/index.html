<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home</title>
</head>
<body style="margin:0;background:#08080c">
<div id="app"></div>
<script src="/js/app.js"></script>
<script>
(async()=>{
  if(!Auth.isLoggedIn()){location.href='/login/';return}
  const r=await Auth.fetchPage('home');
  if(r.status===200){document.open();document.write(r.html);document.close()}
  else if(r.status===401){Auth.clearToken();location.href='/login/'}
  else{document.getElementById('app').innerHTML='<p style="color:#5a5a6e;font-family:monospace;text-align:center;padding:40px">Access Denied</p>'}
})();
</script>
</body>
</html>
