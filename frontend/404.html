<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — The Page Is Empty</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #f6f6f6;
    color: #111111;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }

  /* Main Content Area */
  .main-content {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    width: 100%;
    max-width: 1100px;
  }

  .error-section {
    max-width: 500px;
  }

  .error-tag {
    font-size: 0.85rem;
    color: #777;
    margin-bottom: 16px;
    font-family: monospace;
  }

  h1 {
    font-size: 3.2rem;
    font-weight: 500;
    line-height: 1.15;
    margin-bottom: 32px;
    letter-spacing: -1px;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background-color: #1a1a1a;
    color: #fff;
    padding: 12px 20px;
    border-radius: 4px;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 400;
    transition: background 0.2s;
  }

  .back-btn:hover {
    background-color: #333;
  }

  .error-code {
    font-size: 9rem;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -4px;
    color: #1c1c1c;
  }

  /* Responsive Design */
  @media (max-width: 768px) {
    body {
      padding: 20px;
    }
    .main-content {
      flex-direction: column;
      align-items: flex-start;
      gap: 50px;
    }
    h1 {
      font-size: 2.5rem;
    }
    .error-code {
      font-size: 6rem;
    }
  }
</style>
</head>
<body>

  <!-- Main Content -->
  <div class="main-content">
    <div class="error-section">
      <div class="error-tag">[ Error ]</div>
      <h1>We’re Sorry.<br>The Page Is Empty</h1>
      <a href="#" class="back-btn">↗ Go Back Home</a>
    </div>
    <div class="error-code">404</div>
  </div>

</body>
</html>
