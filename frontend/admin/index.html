<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login — Secure Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">◆ ADMIN ACCESS</div>
    <h1>Admin Login</h1>
    <p class="auth-sub">Administrator credentials required. All attempts are logged.</p>

    <div id="alert" class="alert" style="display:none"></div>

    <form id="adminForm" autocomplete="off">
      <label for="username">Admin Username</label>
      <input type="text" id="username" name="username" required placeholder="admin" autofocus>

      <label for="password">Admin Password</label>
      <input type="password" id="password" name="password" required placeholder="••••••••">

      <button type="submit" class="btn-primary full" id="submitBtn">Access Admin Panel</button>
    </form>

    <div class="auth-footer">
      <a href="/">← Back to home</a>
      <span>·</span>
      <a href="/login/">User Login</a>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
const form    = document.getElementById('adminForm');
const alertEl = document.getElementById('alert');
const btn     = document.getElementById('submitBtn');

/* ★ Admin panel content container */
const loadScreen = document.createElement('div');
loadScreen.id = 'adminLoad';
loadScreen.style.display = 'none';

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (!username || !password) return showAlert('Both fields required.', 'error');

  btn.disabled    = true;
  btn.textContent = 'Verifying…';

  /* ★ Auth.adminLogin() ব্যবহার করো */
  const result = await Auth.adminLogin(username, password);

  if (result.error) {
    showAlert(result.error || 'Admin login failed.', 'error');
    btn.disabled    = false;
    btn.textContent = 'Access Admin Panel';
    return;
  }

  /* ★ Login success — frontend URL-এ admin panel লোড করো */
  window.location.href = '/admin/panel/';
});

function showAlert(msg, type) {
  alertEl.textContent = msg;
  alertEl.className   = 'alert ' + type;
  alertEl.style.display = 'block';
}
</script>
</body>
</html>
